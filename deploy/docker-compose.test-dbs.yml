services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datax_test
      POSTGRES_USER: datax_test
      POSTGRES_PASSWORD: datax_test
    ports:
      - "${DATAX_TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./test-db-init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datax_test -d datax_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: datax_test
      MYSQL_USER: datax_test
      MYSQL_PASSWORD: datax_test
      MYSQL_ROOT_PASSWORD: datax_root
    ports:
      - "${DATAX_TEST_MYSQL_PORT:-33306}:3306"
    volumes:
      - ./test-db-init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdatax_root"]
      interval: 10s
      timeout: 5s
      retries: 10
