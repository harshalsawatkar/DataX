version: '3.8'

services:
  test-postgres:
    image: postgres:16-alpine
    container_name: datax-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password_2026!
      POSTGRES_DB: datax_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d datax_test_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-mysql:
    image: mysql:8.0-oracle
    container_name: datax-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2026!
      MYSQL_DATABASE: datax_test_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password_2026!
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "test_user", "-ptest_password_2026!"]
      interval: 5s
      timeout: 3s
      retries: 5
